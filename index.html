<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multe Ospitaletto FC</title>
</head>
<body style="margin:0; background:#F5F3EC;">
<style>
  :root {
    --pitch: #0F3D2E;
    --pitch-light: #1D5C42;
    --chalk: #F5F3EC;
    --paper: #FFFFFF;
    --ink: #1B1F1D;
    --muted: #7C8579;
    --line: #DCD8CC;
    --yellow-card: #EFC13F;
    --yellow-card-ink: #5A4207;
    --red-card: #B33A3A;
    --paid: #3F7D5C;
  }

  * { box-sizing: border-box; }

  #cassa-multe-root {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    color: var(--ink);
    background: var(--chalk);
    max-width: 760px;
    margin: 0 auto;
    padding: 0 0 48px 0;
    line-height: 1.5;
  }

  #cassa-multe-root .head {
    background: #E7E5DF;
    color: var(--ink);
    padding: 28px 24px 22px 24px;
    border-radius: 0 0 4px 4px;
    display: flex;
    align-items: center;
    gap: 18px;
  }

  #cassa-multe-root .crest {
    width: 66px;
    height: 66px;
    flex-shrink: 0;
    object-fit: contain;
  }

  #cassa-multe-root .head h1 {
    font-family: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 600;
    font-size: 26px;
    margin: 0;
    letter-spacing: 0.3px;
    color: #D9661C;
  }

  #cassa-multe-root .head p {
    margin: 3px 0 0 0;
    font-size: 13.5px;
    color: var(--muted);
  }

  #cassa-multe-root nav {
    display: flex;
    border-bottom: 1px solid var(--line);
    margin: 0 24px;
  }

  #cassa-multe-root nav button {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    font-size: 14.5px;
    font-weight: 700;
    color: var(--muted);
    background: none;
    border: none;
    padding: 14px 4px;
    margin-right: 26px;
    cursor: pointer;
    border-bottom: 2.5px solid transparent;
    transform: translateY(1px);
  }

  #cassa-multe-root nav button.active {
    color: var(--pitch);
    border-bottom-color: var(--yellow-card);
  }

  #cassa-multe-root .panel { padding: 22px 24px 0 24px; }

  #cassa-multe-root .summary-row {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
  }

  #cassa-multe-root .summary-card {
    flex: 1;
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 14px 16px;
  }

  #cassa-multe-root .summary-card .label {
    font-size: 12.5px;
    color: var(--muted);
  }

  #cassa-multe-root .summary-card .value {
    font-family: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    font-size: 26px;
    font-weight: 600;
    margin-top: 2px;
  }

  #cassa-multe-root .value.owed { color: var(--yellow-card-ink); }
  #cassa-multe-root .value.paid { color: var(--paid); }

  #cassa-multe-root .table-wrap {
    background: var(--paper);
    border: 1px solid var(--line);
  }

  #cassa-multe-root .row {
    display: grid;
    grid-template-columns: 30px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }

  #cassa-multe-root .row:last-child { border-bottom: none; }
  #cassa-multe-root .row:hover { background: #FBFAF6; }

  #cassa-multe-root .pos {
    font-family: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    color: var(--muted);
    font-size: 15px;
  }

  #cassa-multe-root .player-name { font-weight: 700; font-size: 15px; }
  #cassa-multe-root .player-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }

  #cassa-multe-root .amount {
    font-family: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    font-size: 19px;
    text-align: right;
    min-width: 78px;
  }

  #cassa-multe-root .amount.owed { color: var(--yellow-card-ink); }
  #cassa-multe-root .amount.settled { color: var(--paid); font-size: 14px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; font-weight: 700; }

  #cassa-multe-root .detail {
    padding: 4px 16px 16px 46px;
    border-bottom: 1px solid var(--line);
    background: #FBFAF6;
  }

  #cassa-multe-root .fine-line {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    font-size: 13.5px;
    border-bottom: 1px dashed var(--line);
  }

  #cassa-multe-root .fine-line:last-child { border-bottom: none; }
  #cassa-multe-root .fine-line .motivo { color: var(--ink); }
  #cassa-multe-root .fine-line .data { color: var(--muted); margin-left: 8px; }
  #cassa-multe-root .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 2px;
  }
  #cassa-multe-root .badge.due { background: var(--yellow-card); color: var(--yellow-card-ink); }
  #cassa-multe-root .badge.ok { background: #DCEBE2; color: var(--paid); }

  #cassa-multe-root .empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  /* Admin */
  #cassa-multe-root .lock-box {
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 32px 24px;
    text-align: center;
    max-width: 340px;
    margin: 30px auto;
  }
  #cassa-multe-root .lock-box h2 {
    font-family: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    font-size: 18px;
    margin: 0 0 6px 0;
  }
  #cassa-multe-root .lock-box p { font-size: 13px; color: var(--muted); margin: 0 0 16px 0; }

  #cassa-multe-root input, #cassa-multe-root select {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    font-size: 14px;
    padding: 9px 10px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    width: 100%;
  }
  #cassa-multe-root input:focus, #cassa-multe-root select:focus {
    outline: 2px solid var(--pitch-light);
    outline-offset: 1px;
  }

  #cassa-multe-root .btn {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 10px 18px;
    background: var(--pitch);
    color: var(--chalk);
    border: none;
    cursor: pointer;
  }
  #cassa-multe-root .btn:hover { background: var(--pitch-light); }
  #cassa-multe-root .btn.full { width: 100%; }
  #cassa-multe-root .btn.danger { background: var(--red-card); }
  #cassa-multe-root .btn.ghost {
    background: none; color: var(--pitch); border: 1px solid var(--line);
  }

  #cassa-multe-root .error-text { color: var(--red-card); font-size: 13px; margin-top: 8px; }

  #cassa-multe-root .form-card {
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 18px;
    margin-bottom: 22px;
  }
  #cassa-multe-root .form-card h3 {
    font-family: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    font-size: 15px;
    margin: 0 0 14px 0;
    font-weight: 500;
  }
  #cassa-multe-root .field { margin-bottom: 12px; }
  #cassa-multe-root .field label {
    display: block;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  #cassa-multe-root .field-row { display: flex; gap: 10px; }
  #cassa-multe-root .field-row .field { flex: 1; }

  #cassa-multe-root .admin-fine-list .fine-admin-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 13.5px;
  }
  #cassa-multe-root .admin-fine-list .fine-admin-row:last-child { border-bottom: none; }
  #cassa-multe-root .fine-admin-row .who { font-weight: 700; min-width: 100px; }
  #cassa-multe-root .fine-admin-row .info { flex: 1; color: var(--muted); }
  #cassa-multe-root .fine-admin-row .imp { font-family: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; }
  #cassa-multe-root .link-btn {
    background: none; border: none; color: var(--pitch); font-size: 12.5px;
    text-decoration: underline; cursor: pointer; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; padding: 0;
  }
  #cassa-multe-root .link-btn.remove { color: var(--red-card); }

  #cassa-multe-root .top-bar-admin {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
  }
  #cassa-multe-root .note {
    font-size: 12px; color: var(--muted); margin-top: 18px; line-height: 1.5;
  }
</style>

<script>
(function() {
  const STORAGE_KEY = 'cassa-multe-data';
  const PASS_KEY = 'cassa-multe-admin-pass';

  let data = { players: [], fines: [] };
  let adminPass = null;
  let unlocked = false;
  let expandedPlayer = null;

  const root = document.getElementById('cassa-multe-root');
  const panelDash = document.getElementById('panel-dash');
  const panelAdmin = document.getElementById('panel-admin');
  const tabDash = document.getElementById('tab-dash');
  const tabAdmin = document.getElementById('tab-admin');

  function euro(n) {
    return '€' + Number(n).toFixed(2).replace('.', ',');
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  // --- Configurazione Google Apps Script ---
  // Sostituisci il valore qui sotto con l'URL del tuo Web App
  // (lo ottieni dopo aver fatto il Deploy dello script nel tuo Google Sheet).
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwYo7aegFTVYwKyThhWXKm9REg_BZl6Xf9I32Q1BasA4WYvKhUV6J0okCXkzg39TiHg9A/exec";

  async function hashPassword(plain) {
    const enc = new TextEncoder().encode(plain);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function fetchState() {
    const res = await fetch(APPS_SCRIPT_URL, { method: 'GET' });
    if (!res.ok) throw new Error('Errore di rete: ' + res.status);
    return res.json();
  }

  async function pushState(state) {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      // Nota: niente header Content-Type impostato manualmente, così il
      // browser non invia una richiesta preflight che Apps Script non gestisce.
      body: JSON.stringify(state)
    });
    if (!res.ok) throw new Error('Errore di rete: ' + res.status);
    return res.json();
  }

  async function loadData() {
    try {
      const remote = await fetchState();
      data = { players: remote.players || [], fines: remote.fines || [] };
      adminPass = remote.adminPassHash || null;
    } catch (e) {
      console.error('Errore caricamento dati dal foglio Google', e);
      data = { players: [], fines: [] };
    }
  }

  async function saveData() {
    try {
      await pushState({
        players: data.players,
        fines: data.fines,
        adminPassHash: adminPass || ''
      });
    } catch (e) {
      console.error('Errore salvataggio dati sul foglio Google', e);
    }
  }

  async function savePass(plain) {
    const hashed = await hashPassword(plain);
    adminPass = hashed;
    try {
      await pushState({
        players: data.players,
        fines: data.fines,
        adminPassHash: hashed
      });
    } catch (e) {
      console.error('Errore salvataggio password sul foglio Google', e);
    }
  }

  // Il foglio Google non ha aggiornamenti "istantanei" come Firebase,
  // quindi controlliamo periodicamente se qualcuno ha modificato i dati.
  function startRealtimeSync() {
    setInterval(async () => {
      try {
        const remote = await fetchState();
        data = { players: remote.players || [], fines: remote.fines || [] };
        if (panelDash.style.display !== 'none') {
          renderDashboard();
        }
      } catch (e) {
        console.error('Errore aggiornamento periodico', e);
      }
    }, 6000);
  }

  function playerTotals(playerId) {
    const pf = data.fines.filter(f => f.playerId === playerId);
    const owed = pf.filter(f => !f.pagata).reduce((s, f) => s + f.importo, 0);
    const paid = pf.filter(f => f.pagata).reduce((s, f) => s + f.importo, 0);
    return { owed, paid, count: pf.filter(f => !f.pagata).length, fines: pf };
  }

  function renderDashboard() {
    if (data.players.length === 0) {
      panelDash.innerHTML = `
        <div class="empty">
          Nessun giocatore registrato ancora.<br>
          Vai su "Gestione" per aggiungere la prima multa.
        </div>`;
      return;
    }

    const totalOwed = data.fines.filter(f => !f.pagata).reduce((s, f) => s + f.importo, 0);
    const totalPaid = data.fines.filter(f => f.pagata).reduce((s, f) => s + f.importo, 0);

    const ranked = data.players
      .map(p => ({ ...p, ...playerTotals(p.id) }))
      .sort((a, b) => b.owed - a.owed);

    let html = `
      <div class="summary-row">
        <div class="summary-card">
          <div class="label">Totale da incassare</div>
          <div class="value owed">${euro(totalOwed)}</div>
        </div>
        <div class="summary-card">
          <div class="label">Totale già pagato</div>
          <div class="value paid">${euro(totalPaid)}</div>
        </div>
      </div>
      <div class="table-wrap">`;

    ranked.forEach((p, i) => {
      const isOpen = expandedPlayer === p.id;
      html += `
        <div class="row" data-player="${p.id}">
          <div class="pos">${i + 1}</div>
          <div>
            <div class="player-name">${p.name}</div>
            <div class="player-sub">${p.count > 0 ? p.count + (p.count === 1 ? ' multa aperta' : ' multe aperte') : 'in regola'}</div>
          </div>
          ${p.owed > 0
            ? `<div class="amount owed">${euro(p.owed)}</div>`
            : `<div class="amount settled">saldato</div>`}
        </div>`;
      if (isOpen) {
        html += `<div class="detail">`;
        if (p.fines.length === 0) {
          html += `<div style="padding:10px 0; color: var(--muted); font-size: 13px;">Nessuna multa registrata.</div>`;
        } else {
          p.fines.slice().sort((a, b) => b.data.localeCompare(a.data)).forEach(f => {
            html += `
              <div class="fine-line">
                <span class="motivo">${f.motivo}<span class="data">${formatDate(f.data)}</span></span>
                <span style="display:flex; align-items:center; gap:8px;">
                  <span>${euro(f.importo)}</span>
                  <span class="badge ${f.pagata ? 'ok' : 'due'}">${f.pagata ? 'pagata' : 'da pagare'}</span>
                </span>
              </div>`;
          });
        }
        html += `</div>`;
      }
    });

    html += `</div>`;
    panelDash.innerHTML = html;

    panelDash.querySelectorAll('.row').forEach(row => {
      row.addEventListener('click', () => {
        const pid = row.getAttribute('data-player');
        expandedPlayer = expandedPlayer === pid ? null : pid;
        renderDashboard();
      });
    });
  }

  function formatDate(iso) {
    if (!iso || typeof iso !== 'string' || !/^\d{4}-\d{2}-\d{2}/.test(iso)) return '—';
    const d = new Date(iso.slice(0, 10) + 'T00:00:00');
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('it-IT', { day: '2-digit', month: 'short' });
  }

  function renderAdminLocked(setupMode) {
    panelAdmin.innerHTML = `
      <div class="lock-box">
        <h2>${setupMode ? 'Imposta la password' : 'Area riservata'}</h2>
        <p>${setupMode
          ? 'Scegli una password per proteggere l&#39;inserimento delle multe. Serve solo a te per accedere qui.'
          : 'Inserisci la password per aggiungere o modificare le multe.'}</p>
        <div class="field">
          <input type="password" id="pass-input" placeholder="Password" />
        </div>
        <button class="btn full" id="pass-submit">${setupMode ? 'Salva password' : 'Entra'}</button>
        <div class="error-text" id="pass-error" style="display:none;"></div>
      </div>
    `;
    const input = document.getElementById('pass-input');
    const submit = document.getElementById('pass-submit');
    const err = document.getElementById('pass-error');

    async function attempt() {
      const val = input.value;
      if (!val) return;
      if (setupMode) {
        if (val.length < 4) {
          err.textContent = 'Usa almeno 4 caratteri.';
          err.style.display = 'block';
          return;
        }
        await savePass(val);
        unlocked = true;
        renderAdmin();
      } else {
        const hashed = await hashPassword(val);
        if (hashed === adminPass) {
          unlocked = true;
          renderAdmin();
        } else {
          err.textContent = 'Password errata.';
          err.style.display = 'block';
        }
      }
    }

    submit.addEventListener('click', attempt);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
    input.focus();
  }

  function renderAdmin() {
    if (!unlocked) {
      renderAdminLocked(adminPass === null);
      return;
    }

    const playerOptions = data.players
      .map(p => `<option value="${p.id}">${p.name}</option>`)
      .join('');

    let html = `
      <div class="top-bar-admin">
        <span style="font-size:13px; color: var(--muted);">Accesso sbloccato</span>
        <button class="link-btn" id="lock-again">Blocca di nuovo</button>
      </div>

      <div class="form-card">
        <h3>Nuova multa</h3>
        <div class="field">
          <label>Giocatore</label>
          <select id="fine-player">
            <option value="__new__">+ Nuovo giocatore</option>
            ${playerOptions}
          </select>
        </div>
        <div class="field" id="new-player-field" style="display:${data.players.length === 0 ? 'block' : 'none'};">
          <label>Nome nuovo giocatore</label>
          <input type="text" id="new-player-name" placeholder="Es. Marco Rossi" />
        </div>
        <div class="field">
          <label>Motivo</label>
          <input type="text" id="fine-motivo" placeholder="Es. Ritardo allenamento" list="motivi-suggeriti" />
          <datalist id="motivi-suggeriti">
            <option value="Ritardo allenamento">
            <option value="Assenza ingiustificata">
            <option value="Cellulare in spogliatoio">
            <option value="Cartellino giallo">
            <option value="Cartellino rosso">
            <option value="Materiale dimenticato">
            <option value="Ritardo partita">
          </datalist>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Importo</label>
            <input type="number" id="fine-importo" placeholder="0.00" min="0" step="0.5" />
          </div>
          <div class="field">
            <label>Data</label>
            <input type="date" id="fine-data" />
          </div>
        </div>
        <button class="btn full" id="add-fine-btn">Aggiungi multa</button>
        <div class="error-text" id="fine-error" style="display:none;"></div>
      </div>

      <div class="form-card">
        <h3>Storico multe</h3>
        <div class="admin-fine-list">`;

    if (data.fines.length === 0) {
      html += `<div style="padding: 6px 0; color: var(--muted); font-size: 13px;">Ancora nessuna multa registrata.</div>`;
    } else {
      const sorted = data.fines.slice().sort((a, b) => b.data.localeCompare(a.data));
      sorted.forEach(f => {
        const player = data.players.find(p => p.id === f.playerId);
        html += `
          <div class="fine-admin-row">
            <span class="who">${player ? player.name : '—'}</span>
            <span class="info">${f.motivo} · ${formatDate(f.data)}</span>
            <span class="imp">${euro(f.importo)}</span>
            <button class="link-btn" data-toggle="${f.id}">${f.pagata ? 'segna non pagata' : 'segna pagata'}</button>
            <button class="link-btn remove" data-remove="${f.id}">rimuovi</button>
          </div>`;
      });
    }

    html += `</div></div>

      <div class="note">
        Nota: questa protezione è pensata per evitare inserimenti accidentali, non è una sicurezza a prova di hacker. I dati veri restano solo nel tuo Google Sheet privato; questa pagina comunica con un piccolo script collegato ad esso. Chi conoscesse l'indirizzo tecnico dello script potrebbe in teoria interrogarlo direttamente scavalcando questa password — per una cassa multe di una squadra il rischio è trascurabile.
      </div>
    `;

    panelAdmin.innerHTML = html;

    document.getElementById('fine-data').value = new Date().toISOString().slice(0, 10);

    document.getElementById('lock-again').addEventListener('click', () => {
      unlocked = false;
      renderAdmin();
    });

    const playerSelect = document.getElementById('fine-player');
    playerSelect.addEventListener('change', () => {
      document.getElementById('new-player-field').style.display =
        playerSelect.value === '__new__' ? 'block' : 'none';
    });

    document.getElementById('add-fine-btn').addEventListener('click', async () => {
      const errEl = document.getElementById('fine-error');
      errEl.style.display = 'none';

      let playerId = playerSelect.value;
      const motivo = document.getElementById('fine-motivo').value.trim();
      const importo = parseFloat(document.getElementById('fine-importo').value);
      const dataVal = document.getElementById('fine-data').value;

      if (playerId === '__new__') {
        const name = document.getElementById('new-player-name').value.trim();
        if (!name) {
          errEl.textContent = 'Inserisci il nome del nuovo giocatore.';
          errEl.style.display = 'block';
          return;
        }
        playerId = uid();
        data.players.push({ id: playerId, name });
      }

      if (!motivo || isNaN(importo) || importo <= 0 || !dataVal) {
        errEl.textContent = 'Compila motivo, importo (maggiore di zero) e data.';
        errEl.style.display = 'block';
        return;
      }

      data.fines.push({
        id: uid(),
        playerId,
        motivo,
        importo,
        data: dataVal,
        pagata: false
      });

      await saveData();
      renderAdmin();
      renderDashboard();
    });

    panelAdmin.querySelectorAll('[data-toggle]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-toggle');
        const f = data.fines.find(x => x.id === id);
        if (f) f.pagata = !f.pagata;
        await saveData();
        renderAdmin();
        renderDashboard();
      });
    });

    panelAdmin.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-remove');
        data.fines = data.fines.filter(x => x.id !== id);
        await saveData();
        renderAdmin();
        renderDashboard();
      });
    });
  }

  tabDash.addEventListener('click', () => {
    tabDash.classList.add('active');
    tabAdmin.classList.remove('active');
    panelDash.style.display = 'block';
    panelAdmin.style.display = 'none';
  });

  tabAdmin.addEventListener('click', () => {
    tabAdmin.classList.add('active');
    tabDash.classList.remove('active');
    panelAdmin.style.display = 'block';
    panelDash.style.display = 'none';
    renderAdmin();
  });

  (async function init() {
    panelDash.innerHTML = `<div class="empty">Caricamento…</div>`;
    await loadData();
    renderDashboard();
    startRealtimeSync();
  })();
})();
</script>

</body>
</html>
